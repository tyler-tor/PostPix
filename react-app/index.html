<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Postpix</title>
    <meta name="description" content="Postpix is a photo-sharing portfolio demo app. Share photos, follow people, like and comment." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F6F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1413" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (Slack, iMessage, LinkedIn...). No og:image yet: it needs an absolute URL, which depends on the final domain (P36). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Postpix" />
    <meta property="og:title" content="Postpix" />
    <meta property="og:description" content="A photo-sharing portfolio demo app: share photos, follow people, like and comment." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Postpix" />
    <meta name="twitter:description" content="A photo-sharing portfolio demo app: share photos, follow people, like and comment." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Postpix needs JavaScript to run. Please turn it on in your browser settings and reload.</noscript>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
